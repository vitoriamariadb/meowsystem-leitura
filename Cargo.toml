# meowsystem-leitura — o applet do modo de leitura na topbar do COSMIC.
#
# O `rev` do libcosmic é pinado aqui e o `Cargo.lock` vai no repositório: a
# versão do Cargo.toml do libcosmic não distingue nada, só o commit distingue.
# `1f6dc99` é o que o painel do COSMIC desta máquina aceitou; quem segue o
# libcosmic do painel instalado troca o `rev` numa cópia (ver INTEGRACAO.md).
#
# `default-features = false` mais `a11y`, `applet` e `wayland`.
[package]
name = "meowsystem-leitura"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0"
rust-version = "1.93"
publish = false
repository = "https://github.com/vitoriamariadb/meowsystem-leitura"

[[bin]]
name = "meowsystem-leitura"
path = "src/main.rs"

# O `jiff` JÁ ESTAVA NESTA ÁRVORE — declará-lo aqui não baixa um byte Ele entra
# pelo libcosmic, e o `Cargo.lock` ao lado o registra em 0.2.35 desde antes de
# existir uma linha nossa que o use.
#
# PARA QUE ELE SERVE, EM UMA LINHA: `Zoned::now()`, o único jeito honesto de
# saber a hora LOCAL — e a hora local é o que decide se o ícone da barra é o sol
# ou a lua.
[dependencies]
jiff = "0.2.35"
serde_json = "1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "1f6dc991eaa5115a09be2505cc8a323e5b2b0bff"
default-features = false
features = ["a11y", "applet", "wayland"]

# Um binário de applet que só desenha não precisa de símbolo nenhum.
[profile.release]
strip = true
